<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdWatch Journal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="overlay-screen">
        <div class="cozy-panel" style="text-align: center;">
            <h1 class="cozy-title">BirdWatch</h1>
            <p>Welcome to your personal bird journal.</p>
            <br>
            <button id="google-login-btn" class="cozy-btn">Log in with Google</button>
        </div>
    </div>

    <!-- TELA DE AGUARDANDO APROVAÇÃO -->
    <div id="pending-screen" class="overlay-screen hidden">
        <div class="cozy-panel" style="text-align: center;">
            <h1 class="cozy-title">Awaiting Approval</h1>
            <p>Your account has been created, but the administrator (Admin) needs to approve your access.</p>
            <p>Please contact the Admin and check back later.</p>
            <br>
            <button id="logout-pending-btn" class="cozy-btn-secondary">Log out</button>
        </div>
    </div>

    <!-- O APP PRINCIPAL (MAPA) -->
    <div class="app-container hidden" id="main-app">
        <aside class="sidebar">
            <h1 class="cozy-title">BirdWatch</h1>
            <nav>
                <ul>
                    <li><button>🌍 Main Map</button></li>
                    <li><button>🦉 Found Species</button></li>
                    <li><button>📚 Global Database</button></li>
                </ul>
            </nav>
            <button id="logout-btn" class="cozy-btn-secondary" style="margin-top:auto;">Logout</button>
        </aside>

        <main class="map-area">
            <div id="map"></div>
        </main>
    </div>

    <!-- Modal de adicionar pássaro -->
    <div id="add-bird-modal" class="modal hidden">
        <div class="modal-content cozy-panel">
            <h2>Record a Bird</h2>
            <input type="text" id="bird-informal-name" placeholder="Bird Name">
            <button id="save-bird-btn" class="cozy-btn">Save Discovery</button>
            <button id="close-modal-btn" class="cozy-btn-secondary">Cancel</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
